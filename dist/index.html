<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  

  <title>Interactive Map</title>
  <script type="module" crossorigin src="/map-app/assets/index-a1064aa9.js"></script>
  <link rel="stylesheet" href="/map-app/assets/index-41af93fc.css">
</head>

<body>
  <div id="map"></div>
  <div id="controls">
    <input type="text" id="filterInput" placeholder="Фильтр по описанию">
  </div>
  <div id="markerInfo">
    <input type="text" id="markerType" placeholder="Тип">
    <input type="text" id="markerName" placeholder="Название">
    <input type="text" id="markerDescription" placeholder="Описание">
    <input type="color" id="markerColor" value="#ff0000">
    <div class="controls">
      <button id="addMarker">Добавить маркер</button>
      <button id="saveMarker">Изменить</button>
      <button id="deleteMarker">Удалить</button>
    </div>
  </div>
  
</body>

</html>
